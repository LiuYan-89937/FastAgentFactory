[package]
name = "combo-desktop"
version = "1.0.0"
description = "Combo - 动态智能体协作桌面应用"
authors = ["Combo Team"]
license = "MIT"
repository = "https://github.com/LiuYan-89937/Combo"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-single-instance = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.10"
wait-timeout = "0.2"
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
enigo = "0.6.1"
uuid = { version = "1", features = ["v4"] }
xcap = { version = "0.9.8", features = ["image", "wgc"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
